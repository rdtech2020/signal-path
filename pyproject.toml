[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-path"
version = "0.1.0"
description = "SignalPath: turn observational data into a ranked, explainable sales queue"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
